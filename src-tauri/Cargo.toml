[package]
name = "asdf"
version = "0.1.0"
description = "Agentic development environment for running coding agents like Claude Code and Codex in parallel, each in its own git worktree."
authors = ["teamBuzzle"]
edition = "2021"
license = "MIT"
repository = "https://github.com/teamBuzzle/asdf"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "asdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.5"
portable-pty = "0.9.0"


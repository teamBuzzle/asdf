name: Bug report
description: Something does not work the way it should.
labels: ["type:fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the release you are on.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.2 (Apple Silicon)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output or a stack trace, if you have one.
      render: text
